main: net.tfminecraft.marketblock.MarketBlock
api-version: '1.21.10'
name: MarketBlock
version: ${project.version}
author: Drefvelin

depend: [DenarEconomy, TLibs]
softdepend: [Cooking]

commands:
  marketblock:
    usage: /<command>
    description: MarketBlock Command
    permission: marketblock.admin

permissions:
  marketblock.admin:
    description: Add, delete, reset and reload market trades
    default: op
